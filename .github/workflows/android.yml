name: Build Motion independently
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build, lint and JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the verified official JDK
        run: |
          ./tools/setup-jdk.sh "$RUNNER_TEMP/motion-jdk"
          echo "JAVA_HOME=$RUNNER_TEMP/motion-jdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/motion-jdk/bin" >> "$GITHUB_PATH"
      - name: Verify inputs and install pinned Android build packages
        run: |
          ./tools/verify-wrapper.sh
          python3 provenance/verify-distribution.py
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Independently build, lint and run JVM tests
        run: ./gradlew --dependency-verification=strict --no-daemon :app:assembleDebug :app:assembleRelease :engine:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug :app:lintRelease :engine:testDebugUnitTest
      - name: Require ten executed JVM tests
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in pathlib.Path('engine/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          total = lambda key: sum(int(s.get(key, '0')) for s in suites)
          assert total('tests') == 10
          assert total('failures') == total('errors') == total('skipped') == 0
          print('Ten JVM tests passed. Device assertions are a separate acceptance step.')
          PY
      - name: Verify actual binary notices, linkage and alignment
        run: python3 tools/check-packaging.py
      - name: Package matching complete source and developer APK
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz --prefix=oritwig-motion/ HEAD > "artifacts/oritwig-motion-source-${GITHUB_SHA}.tar.gz"
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/oritwig-motion-debug.apk
          printf 'commit=%s\nbuild=debug-signed developer preview\n' "$GITHUB_SHA" > artifacts/BUILD-INFO.txt
          (cd artifacts && sha256sum *.apk *.tar.gz BUILD-INFO.txt > SHA256SUMS)
      - name: Upload source, developer APK and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: motion-ci-${{ github.sha }}
          path: |
            artifacts/
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-release.*
            engine/build/test-results/testDebugUnitTest/
            evidence/packaging.json
          if-no-files-found: warn
          retention-days: 14
